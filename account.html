<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SXPAY - حسابي</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8fd;color:#13243d;font-family:Arial,Tahoma}.w{width:92%;max-width:850px;margin:auto}.box{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:22px;margin:35px 0}.input{width:100%;padding:11px;margin:6px 0;border:1px solid #d7e2ee;border-radius:9px}.btn{background:#1264e8;color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:9px 14px;border:1px solid #dce5ef;background:#fff;border-radius:9px;cursor:pointer}.tab.on{background:#1264e8;color:#fff}.hidden{display:none}.order{border-bottom:1px solid #edf1f6;padding:14px 0}.blue{color:#1264e8}</style></head><body><main class="w"><div class="box"><h1>SX<span class="blue">PAY</span> — حسابي</h1><div class="tabs"><button class="tab on" id="lt">تسجيل الدخول</button><button class="tab" id="rt">إنشاء حساب</button></div>
<div id="login"><input class="input" id="li" placeholder="البريد الإلكتروني أو اسم المستخدم"><div style="display:flex;gap:6px"><input class="input" id="lp" type="password" placeholder="كلمة المرور" style="margin:6px 0"><button class="tab" type="button" onclick="togglePass('lp',this)">👁️</button></div><button class="btn" onclick="login()">دخول</button></div>
<div id="reg" class="hidden"><input class="input" id="rn" placeholder="الاسم"><input class="input" id="ru" placeholder="اسم المستخدم"><input class="input" id="re" type="email" placeholder="البريد الإلكتروني"><input class="input" id="rp" placeholder="رقم الهاتف"><div style="display:flex;gap:6px"><input class="input" id="rpass" type="password" placeholder="كلمة المرور" style="margin:6px 0"><button class="tab" type="button" onclick="togglePass('rpass',this)">👁️</button></div><div style="display:flex;gap:6px"><input class="input" id="rc" type="password" placeholder="تأكيد كلمة المرور" style="margin:6px 0"><button class="tab" type="button" onclick="togglePass('rc',this)">👁️</button></div><button class="btn" onclick="register()">إنشاء الحساب</button></div><p id="msg"></p></div>
<div class="box hidden" id="profile"><h2>مرحبًا، <span id="name"></span> 👋</h2><p id="info"></p><button class="btn" onclick="orders()">عرض طلباتي</button> <button class="btn" style="background:#d93843" onclick="logout()">تسجيل الخروج</button><div id="orders"></div></div></main>
<script>const $=x=>document.getElementById(x);function togglePass(id,b){let x=$(id);x.type=x.type==="password"?"text":"password";b.textContent=x.type==="password"?"👁️":"🙈"}async function api(u,o={}){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
$("lt").onclick=()=>{ $("login").classList.remove("hidden");$("reg").classList.add("hidden");$("lt").classList.add("on");$("rt").classList.remove("on")};$("rt").onclick=()=>{$("reg").classList.remove("hidden");$("login").classList.add("hidden");$("rt").classList.add("on");$("lt").classList.remove("on")};
async function login(){try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:$("li").value,password:$("lp").value})});load()}catch(e){$("msg").textContent=e.message}}
async function register(){try{let b={name:$("rn").value,username:$("ru").value,email:$("re").value,phone:$("rp").value,password:$("rpass").value,confirmPassword:$("rc").value};await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});load()}catch(e){$("msg").textContent=e.message}}
async function load(){try{let d=await api("/api/auth/me");$("profile").classList.remove("hidden");$("name").textContent=d.user.name;$("info").textContent=`@${d.user.username} · ${d.user.email} · ${d.user.phone}`;document.querySelector(".box").classList.add("hidden");orders()}catch{}}
async function orders(){let a=await api("/api/auth/orders");$("orders").innerHTML="<h3>طلباتي</h3>"+(a.length?a.map(o=>`<div class=order><b>طلب #${o.id}</b> — ${o.status} — ${Number(o.total).toLocaleString("ar-DZ")} دج<br><small>${o.created_at}</small></div>`).join(""):"لا توجد طلبات بعد")}
async function logout(){await api("/api/auth/logout",{method:"POST"});location.reload()}load()</script></body></html>
